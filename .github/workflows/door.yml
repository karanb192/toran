name: Hang an approved door

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  hang:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'door')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the line to doors.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/add-door.mjs
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "door/$N"
          git add doors.json
          git commit -m "Hang the door from issue $N"
          git push -u origin "door/$N"
          gh pr create --base main --title "Hang the door from issue $N" --body "Closes #$N"
